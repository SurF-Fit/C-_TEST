<header class="app-header">
    <div class="header-content">
        <h1>📊 Timescale Data Processor</h1>
        <nav>
            <button class="nav-btn" (click)="activeTab = 'upload'" [class.active]="activeTab === 'upload'">
                📤 Загрузка
            </button>
            <button class="nav-btn" (click)="activeTab = 'results'" [class.active]="activeTab === 'results'">
                📊 Результаты
            </button>
        </nav>
    </div>
</header>

<main class="app-main">
    <div class="tab-content">
        <app-upload *ngIf="activeTab === 'upload'"></app-upload>
        <app-results *ngIf="activeTab === 'results'"></app-results>
    </div>
</main>
